<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nollie Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FF4B1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nollie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Layout: página clara e respirada; um painel escuro por tela concentra o que importa; laranja só para ação e alerta */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --sunk:#EAEAE6; --line:#E1E1DC;
  --fg:#0E0E0D; --muted:#6C6C66;
  --accent:#FF4B1F; --accent-2:#FF7A4D; --on-accent:#FFFFFF; --accent-soft:#FFE7DE; --accent-deep:#B8300C; --trip:#2E4BD8;
  --ink:#121212; --ink-2:#1E1E1D; --ink-3:#2A2A28; --ink-fg:#F4F4F0; --ink-muted:#9C9C95;
  --ok:#1E9E5A; --wait:#B7860B; --wait-soft:#F7EDCF;
  --f:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:30px; --r:22px; --r-sm:14px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#161615; --sunk:#1F1F1D; --line:#2A2A27;
  --fg:#F2F2EE; --muted:#97978F;
  --accent:#FF5A2E; --accent-2:#FF8558; --on-accent:#FFFFFF; --accent-soft:#3A1B10; --accent-deep:#B23310; --trip:#4A64E8;
  --ink:#171716; --ink-2:#222220; --ink-3:#30302D; --ink-fg:#F4F4F0; --ink-muted:#9C9C95;
  --ok:#4FCB86; --wait:#E4BD52; --wait-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161615; --sunk:#1F1F1D; --line:#2A2A27;
  --fg:#F2F2EE; --muted:#97978F;
  --accent:#FF5A2E; --accent-2:#FF8558; --on-accent:#FFFFFF; --accent-soft:#3A1B10; --accent-deep:#B23310; --trip:#4A64E8;
  --ink:#171716; --ink-2:#222220; --ink-3:#30302D; --ink-fg:#F4F4F0; --ink-muted:#9C9C95;
  --ok:#4FCB86; --wait:#E4BD52; --wait-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 15.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font:700 21px/1 var(--f);letter-spacing:-.03em}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center}
.mark i{width:14px;height:14px;border-radius:50%;background:var(--bg);display:block}
nav.side{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px}
.nav-btn:hover{background:var(--sunk);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav-btn .lbl{flex:1}
.count{font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.lens{padding:0 4px}
select,input,textarea{background:var(--sunk);border:1px solid transparent;border-radius:var(--r-sm);padding:11px 14px;width:100%;font-weight:500}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background-color:var(--surface)}
textarea{resize:vertical;min-height:110px;line-height:1.55}
.lens select{border-radius:999px;background-color:var(--surface);border-color:var(--line);font-weight:600}
main{padding-block:36px 140px;padding-inline:clamp(16px,4vw,56px);min-width:0;max-width:1080px;width:100%}

/* ---------- tipografia ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:end;margin-bottom:28px}
.hero h1{font:500 clamp(46px,8.2vw,104px)/.92 var(--f);letter-spacing:-.045em;margin:0;text-wrap:balance}
.hero .badge{width:clamp(64px,8vw,96px);aspect-ratio:1;border-radius:28%;background:var(--accent);display:grid;place-items:center;align-self:start;margin-top:8px}
.hero .badge{border:0;padding:0;cursor:pointer;position:relative}
.hero .badge:hover{filter:brightness(1.05)}
.hero .badge img{width:62%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block}
.badge-busy{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.35)}
.hero .badge span{width:62%;aspect-ratio:1;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 clamp(20px,2.6vw,30px)/1 var(--f)}
.hero p{grid-column:1/-1;justify-self:end;max-width:440px;color:var(--muted);margin:0;font-size:16px;line-height:1.55}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.head h1{font:500 clamp(38px,6vw,64px)/.95 var(--f);letter-spacing:-.04em;margin:0}
.sub{color:var(--muted);margin:10px 0 0;max-width:520px}
h2{font:600 19px/1.2 var(--f);letter-spacing:-.01em;margin:0}
h2 .n{color:var(--muted);font-weight:500;margin-left:6px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

/* ---------- superfícies ---------- */
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.panel{background:var(--surface);border-radius:var(--r);padding:20px 20px 12px;box-shadow:var(--shadow)}
.dark{position:relative;isolation:isolate;overflow:hidden;background:var(--ink);color:var(--ink-fg);border-radius:var(--r-lg);padding:clamp(18px,3vw,32px)}
.dark::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 70% at 70% -10%,rgba(255,255,255,.09),transparent 60%)}
.dark::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:104px 104px;-webkit-mask-image:linear-gradient(to bottom,transparent 45%,#000);mask-image:linear-gradient(to bottom,transparent 45%,#000)}
.dark h2{color:var(--ink-fg)}
.dark .sub,.dark .empty{color:var(--ink-muted)}
.circles{display:flex;gap:8px}
.circ{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:0}
.circ.w{background:#fff;color:var(--accent)}
.circ.o{background:var(--accent);color:var(--on-accent)}
.circ svg.i{width:22px;height:22px}

/* ---------- linhas ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-width:0}
.ph+.row,.ph+div>.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.row .t small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:1px}
.row.click,.row .t.click{cursor:pointer}
.row.click:hover .t,.row .t.click:hover{color:var(--accent)}
.check{width:28px;height:28px;flex:none;border:1.8px solid var(--muted);border-radius:50%;background:none;padding:0;display:grid;place-items:center;color:var(--on-accent)}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg.i{width:15px;height:15px;stroke-width:2.6}
.done .t{color:var(--muted);text-decoration:line-through;font-weight:500}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.late{background:var(--accent-soft);color:var(--accent)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.chip.ink{background:var(--fg);color:var(--bg)}
.star{border:0;background:none;color:var(--line);padding:4px;display:grid;place-items:center;border-radius:50%}
.star:hover{color:var(--muted)}
.star.on{color:var(--accent)}
.star.on svg.i{fill:currentColor}
.av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);color:var(--fg);letter-spacing:.02em}
.av.hot{background:linear-gradient(140deg,var(--accent-2),var(--accent));color:var(--on-accent)}
.time{font-weight:700;color:var(--fg);min-width:48px;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{color:var(--muted);font-size:14.5px;padding:10px 2px 14px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.black{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:12px}
.btn.ghost:hover{color:var(--fg);background:var(--sunk)}
.btn.danger{color:var(--accent)}
.btn.danger.primary{color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg.i{width:18px;height:18px}

/* ---------- captura ---------- */
.capture{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:999px;padding:7px 7px 7px 22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.capture:focus-within{border-color:var(--accent)}
.capture input{border:0;background:none;flex:1;min-width:0;padding:10px 0;font-size:16px}
.capture input:focus{background:none}
.capture .go{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.capture .go:disabled{opacity:.5}

/* ---------- hoje: painel escuro ---------- */
.today-dark .ph{margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:26px}
.stat{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);padding:16px 18px;text-align:left;color:inherit}
button.stat:hover{border-color:var(--ink-muted)}
.stat b{display:block;font:500 clamp(34px,4.4vw,48px)/1 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-muted);font-size:13.5px;font-weight:600}
.stat.hot b{color:var(--accent)}
.stat.ok b{color:var(--ok)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.pcard{display:flex;flex-direction:column;gap:8px}
.pcard-head{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.pcard-head .t{flex:1;min-width:0;cursor:pointer}
.pcard-head strong{display:block;font:600 19px/1.2 var(--f);letter-spacing:-.01em;overflow-wrap:anywhere}
.pcard-head small{display:block;opacity:.85;font-size:13.5px;margin-top:6px}
.pcard-head .check{border-color:rgba(255,255,255,.8)}
.pcard-head .check:hover{background:rgba(255,255,255,.18)}
.pcard-head .star{color:#fff}
.pcard-head .star svg.i{fill:currentColor}
.pcard-body{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--r);padding:14px 18px}
.pcard-body .k{font-weight:600;color:var(--ink-fg);font-size:14px}
.pcard-body p{margin:3px 0 0;color:var(--ink-muted);font-size:14px}
.pslot{border:1.5px dashed var(--ink-3);border-radius:var(--r);padding:22px 18px;color:var(--ink-muted);font-size:14.5px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:none;text-align:left}
.pslot:hover{border-color:var(--ink-muted);color:var(--ink-fg)}
.pslot b{font-size:30px;font-weight:500;color:var(--ink-3);line-height:1}

/* ---------- abas ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dark .tab{background:var(--ink-2);border-color:var(--ink-3);color:var(--ink-fg)}
.dark .tab:hover{border-color:var(--ink-muted)}

/* ---------- cartões ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:var(--shadow);min-width:0}
.card:hover{box-shadow:0 0 0 1.5px var(--fg),var(--shadow)}
.card h3{font:600 21px/1.15 var(--f);letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .ico{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.card .big{font:500 44px/1 var(--f);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card .big small{font-size:15px;color:var(--muted);letter-spacing:0;font-weight:600;margin-left:6px}
.card.ink{background:var(--ink);color:var(--ink-fg)}
.card.ink .note-body{color:var(--ink-muted)}
.card.ink .chip{background:var(--ink-2);color:var(--ink-fg)}
.card.ink .chip.acc{background:var(--accent);color:var(--on-accent)}
.card.ink .pipeline span{background:var(--ink-2);color:var(--ink-muted)}
.card.ink .pipeline span.on{background:var(--accent);color:var(--on-accent)}
.card.ink:hover{box-shadow:0 0 0 1.5px var(--accent)}
.bar{height:8px;background:var(--sunk);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:9px}
.pipeline{display:flex;gap:4px;flex-wrap:wrap}
.pipeline span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pipeline span.on{background:var(--accent);color:var(--on-accent)}
.note-body{white-space:pre-wrap;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- agenda ---------- */
.day{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-size:13px;font-weight:600;color:var(--muted);text-transform:lowercase;line-height:1.3}
.day .d b{display:block;font:500 34px/1 var(--f);letter-spacing:-.04em;color:var(--fg)}
.day.today .d b,.day.today .d{color:var(--accent)}
.day .row:first-child{border-top:0;padding-top:4px}
.row.agx{background:var(--trip);color:#fff;border-radius:var(--r-sm);padding:12px 14px;border-top:0;margin-block:4px}
.row.agx+.row{border-top:0}
.row.agx .t,.row.agx .t small,.row.agx .time,.row.agx:hover .t,.day.wk .row.agx .t{color:#fff}
.row.agx .chip{background:rgba(255,255,255,.2);color:#fff}
.day.wk.trip{background:var(--trip)}
.day.trip .row.agx{background:none;padding:12px 2px;margin:0;border-radius:0}
.day.trip:has(+.day.trip){border-bottom-left-radius:0;border-bottom-right-radius:0}
.day.trip+.day.trip{border-top-left-radius:0;border-top-right-radius:0;border-top:1px solid rgba(255,255,255,.22)}
.day.wk.sun{background:var(--accent-deep)}
.day.wk{background:var(--accent);color:var(--on-accent);border-radius:var(--r-sm);padding-inline:14px;margin-inline:-8px;border-top-color:transparent}
.day.wk+.day{border-top-color:transparent}
.day.wk .d,.day.wk .d b,.day.wk .empty,.day.wk .time,.day.wk .row .t small,.day.wk .row .t{color:var(--on-accent)}
.day.wk .row{border-top-color:rgba(255,255,255,.3)}
.day.wk .chip,.day.wk .chip.late{background:rgba(255,255,255,.22);color:var(--on-accent)}
.day.wk .check{border-color:var(--on-accent)}
.day.wk .row.click:hover .t,.day.wk .row .t.click:hover{color:var(--on-accent);text-decoration:underline}
.day.wk .star{color:rgba(255,255,255,.55)}
.day.wk .star.on{color:var(--on-accent)}

/* ---------- captura com IA ---------- */
.compose{background:var(--surface);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow)}
.compose textarea{background:none;border:0;font-size:18px;min-height:150px;padding:14px 16px}
.compose textarea:focus{background:none}
.compose .actions{padding:4px 6px 6px}
.proposal{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.proposal.off{opacity:.5}
.proposal .pt{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--on-accent);padding:12px 18px;font-weight:700}
.proposal.off .pt{background:var(--muted)}
.proposal .pt input{width:20px;height:20px;accent-color:var(--fg);flex:none}
.proposal .pt span{flex:1}
.proposal .fields{padding:16px 18px}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}

/* ---------- painel lateral ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,8,8,.5);display:flex;justify-content:flex-end;z-index:20;backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:min(580px,100%);height:100%;overflow:auto;padding:22px clamp(16px,4vw,32px) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;border-radius:var(--r-lg) 0 0 var(--r-lg)}
.sheet>*{flex-shrink:0}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:env(safe-area-inset-top,0px)}
.sheet .kind{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.sheet .kind .circ{width:40px;height:40px}
.sheet .kind .circ svg.i{width:18px;height:18px}
.sheet .title-in{font:600 28px/1.15 var(--f);letter-spacing:-.02em;background:none;border:0;padding:4px 0;border-bottom:1.5px solid var(--line);border-radius:0}
.sheet .title-in:focus{background:none;border-color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{border-color:var(--fg)}

/* ---------- editor de notas ---------- */

const TODAY=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5);
const WD=["dom","seg","ter","qua","qui","sex","sáb"],MO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmt=s=>{if(!s)return"";const d=new Date(s+"T12:00:00");const n=diff(s,TODAY());if(n===0)return"hoje";if(n===1)return"amanhã";if(n===-1)return"ontem";return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// ---------- dados ----------
const all=k=>[...S.items.values()].filter(i=>i.kind===k&&(S.area==="Tudo"||!i.area||i.area===S.area));
const anyKind=k=>[...S.items.values()].filter(i=>i.kind===k);
const get=id=>S.items.get(id);
const nameOf=id=>get(id)?.title||"";

function initStore(){
  return (async()=>{
    try{
      const db=await claude.use("db"), user=await claude.use("user");
      const id=user&&await user.id();
      if(db&&id){
        const col=db.collection("data/users/"+id);
        col.onSnapshot(snap=>{
          S.items=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.ready=true;render();
        },()=>{toast("Não consegui carregar seus dados. Recarregue a página.")});
        store={
          save:async it=>{const {id:k,...body}=it;await col.doc(k).set(body)},
          del:async k=>{await col.doc(k).delete()},
          persistent:true
        };
        return;
      }
    }catch(e){}
    localStore();
  })();
}
function localStore(){
  try{const raw=localStorage.getItem("lifeos");if(raw)S.items=new Map(JSON.parse(raw).map(i=>[i.id,i]))}catch(e){}
  const flush=()=>{try{localStorage.setItem("lifeos",JSON.stringify([...S.items.values()]))}catch(e){}};
  store={save:async it=>{S.items.set(it.id,it);flush();render()},del:async k=>{S.items.delete(k);flush();render()},persistent:false};
  S.ready=true;render();
}
async function save(it){
  it.updated=new Date().toISOString(); if(!it.created)it.created=it.updated;
  S.items.set(it.id,it); render();
  try{await store.save(it)}catch(e){toast(e?.code==="quota_exceeded"?"Espaço cheio: apague itens antigos.":"Não salvou. Tente de novo.")}
}
async function remove(id){S.items.delete(id);render();try{await store.del(id)}catch(e){toast("Não apagou. Tente de novo.")}}
function make(kind,f={}){return {id:uid(),kind,title:"",area:S.area==="Tudo"?"":S.area,...f}}

// ---------- regras ----------
const isLate=t=>t.status!=="feita"&&t.due&&t.due<TODAY();
const openTasks=()=>all("task").filter(t=>t.status!=="feita");
function contactDue(p){if(!p.cadence)return null;const base=p.lastContact||p.created?.slice(0,10)||TODAY();return addDays(base,Number(p.cadence))}
function peopleToContact(){return all("person").filter(p=>{const d=contactDue(p);return d&&d<=TODAY()}).sort((a,b)=>contactDue(a)<contactDue(b)?-1:1)}
const REP_LABEL={"7":"toda semana","14":"a cada 2 semanas"};
function occursOn(e,d){
  if(!e.date)return false;
  if(!e.repeat)return e.date===d;
  if(d<e.date||(e.until&&d>e.until)||(e.skip||[]).includes(d))return false;
  return diff(d,e.date)%Number(e.repeat)===0;
}
function occurrences(evs,from,to){const out=[];for(let d=from;d<=to;d=addDays(d,1))for(const e of evs)if(occursOn(e,d))out.push({e,d});return out}
function projectStats(p){const ts=anyKind("task").filter(t=>t.projectId===p.id);const done=ts.filter(t=>t.status==="feita").length;return {total:ts.length,done,pct:ts.length?Math.round(done/ts.length*100):0,late:ts.filter(isLate).length}}
function projectRisk(p){if(p.status==="concluído")return false;const s=projectStats(p);if(p.due&&diff(p.due,TODAY())<=7&&s.pct<70)return true;return s.late>0}

// ---------- componentes ----------
function taskRow(t){
  const late=isLate(t),wait=t.status==="aguardando",done=t.status==="feita";
  const chips=[];
  if(t.due)chips.push(`<span class="chip ${late?"late":""}">${esc(fmt(t.due))}${t.time?" · "+esc(t.time):""}</span>`);
  if(wait)chips.push(`<span class="chip wait">aguardando${t.personId?" "+esc(nameOf(t.personId)):""}</span>`);
  const ctx=[t.projectId&&nameOf(t.projectId),!wait&&t.personId&&nameOf(t.personId),S.area==="Tudo"&&t.area].filter(Boolean).map(esc).join(" · ");
  return `<div class="row ${done?"done":""}">
    <button class="check ${done?"on":""}" data-act="toggle" data-id="${t.id}" aria-label="${done?"Reabrir":"Concluir"}">${done?ic("check"):""}</button>
    <div class="t click" data-act="open" data-id="${t.id}">${esc(t.title)}${ctx?`<small>${ctx}</small>`:""}</div>
    <span class="meta">${chips.join("")}</span>
    ${done?"":`<button class="star ${t.prio?"on":""}" data-act="prio" data-id="${t.id}" aria-label="Prioridade do dia" title="Prioridade do dia">${ic("star")}</button>`}
  </div>`;
}
const list=(items,fn,empty)=>items.length?items.map(fn).join(""):`<div class="empty">${empty}</div>`;
function personRow(p){
  const d=contactDue(p),n=d?diff(d,TODAY()):null,hot=n!==null&&n<=0;
  return `<div class="row">
    <span class="av ${hot?"hot":""}">${esc(initials(p.title))}</span>
    <div class="t click" data-act="open" data-id="${p.id}">${esc(p.title)}<small>${esc([p.role,p.lastContact?"último contato "+fmt(p.lastContact):"sem contato registrado"].filter(Boolean).join(" · "))}</small></div>
    ${hot?`<span class="chip late">${n===0?"hoje":-n+" dias"}</span>`:""}
    <button class="btn ghost" data-act="contact" data-id="${p.id}" title="Registrar contato hoje">${ic("check")}<span class="hide-s">Falei</span></button>
  </div>`;
}
const isAgendaBlock=e=>/^\s*agenda\b/i.test(e.title||"");
function eventRow(e){return `<div class="row click ${isAgendaBlock(e)?"agx":""}" data-act="open" data-id="${e.id}"><span class="time">${esc(e.time||"—")}</span><div class="t">${esc(e.title)}${e.repeat?` <span class="chip" style="margin-left:4px">↻ ${REP_LABEL[e.repeat]||"repete"}</span>`:""}<small>${esc([e.place,e.projectId&&nameOf(e.projectId),e.personId&&nameOf(e.personId)].filter(Boolean).join(" · "))||"&nbsp;"}</small></div></div>`}
const panel=(title,n,body,action="")=>`<section class="panel"><div class="ph"><h2>${title}${n?`<span class="n">${n}</span>`:""}</h2>${action}</div>${body}</section>`;

function pcard(t){
  const ctx=[t.projectId&&["Projeto",nameOf(t.projectId)],t.personId&&["Pessoa",nameOf(t.personId)],t.area&&["Área",t.area]].filter(Boolean);
  return `<div class="pcard">
    <div class="pcard-head">
      <button class="check" data-act="toggle" data-id="${t.id}" aria-label="Concluir"></button>
      <div class="t" data-act="open" data-id="${t.id}"><strong>${esc(t.title)}</strong><small>${t.due?esc(fmt(t.due))+(t.time?" · "+esc(t.time):""):"sem prazo"}</small></div>
      <button class="star on" data-act="prio" data-id="${t.id}" aria-label="Tirar das prioridades">${ic("star")}</button>
    </div>
    ${ctx.length||t.body?`<div class="pcard-body">${ctx.map(([k,v])=>`<div class="k">${k}: <span style="color:var(--ink-muted);font-weight:500">${esc(v)}</span></div>`).join("")}${t.body?`<p>${esc(t.body.slice(0,140))}</p>`:""}</div>`:""}
  </div>`;
}
function vHoje(){

  const today=open.filter(x=>x.due===t&&!x.prio);
  const waiting=open.filter(x=>x.status==="aguardando");
  const evs=all("event").filter(e=>occursOn(e,t)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const ppl=peopleToContact();
  const disc=disciplesNeeding();
  const rvWs=currentReviewWeek(),rvReady=new Date().getDay()===0||get(reviewId(rvWs));

  const summary=[
    `${WD[d.getDay()][0].toUpperCase()+WD[d.getDay()].slice(1)}, ${d.getDate()} de ${MO[d.getMonth()]}.`,
    late.length?`${late.length} tarefa${late.length>1?"s":""} atrasada${late.length>1?"s":""}.`:"Nada atrasado.",
    next?`Próximo: ${next.title}${next.time?" às "+next.time:""}.`:evs.length?"":"Agenda livre hoje.",

  return `<header class="hero"><h1>${hi},<br>Duca.</h1><button class="badge" data-act="avatar" title="Trocar foto de perfil" aria-label="Trocar foto de perfil">${get("profile")?.photo?`<img src="/_blob/${esc(get("profile").photo)}" alt="Foto de perfil">`:`<span>${initials("Lucas Duca")}</span>`}${S.avatarBusy?`<i class="badge-busy"></i>`:""}</button><p>${esc(summary)}</p></header>
  <div class="stack">
    ${captureBar()}
    ${new Date().getDay()===0||(new Date().getDay()===1&&get(reviewId(currentReviewWeek())))?`<button class="revbanner" data-act="go" data-v="revisao"><span class="circ o">${ic("trend")}</span><span><b>${get(reviewId(currentReviewWeek()))?"Sua revisão da semana está pronta":"Domingo é dia de revisão"}</b><small>Veja como foi sua semana e as 3 prioridades da próxima.</small></span>${ic("arrow")}</button>`:""}
    ${!store?.persistent&&S.ready?`<div class="banner">Seus dados ficam salvos só neste aparelho.</div>`:""}
    <section class="dark today-dark">
      <div class="ph"><h2>Hoje importa</h2><div class="circles"><button class="circ w" data-act="go" data-v="tarefas" aria-label="Tarefas">${ic("bolt")}</button><button class="circ o" data-act="go" data-v="ia" aria-label="Assistente">${ic("spark")}</button></div></div>
      <div class="stats">
        <button class="stat ${late.length?"hot":""}" data-act="go" data-v="tarefas"><b>${late.length}</b><span>Atrasadas</span></button>
        <button class="stat" data-act="go" data-v="tarefas"><b>${today.length+prio.filter(x=>x.due===t).length}</b><span>Para hoje</span></button>
        <button class="stat" data-act="go" data-v="agenda"><b>${evs.length}</b><span>Compromissos</span></button>
        <button class="stat ${ppl.length?"hot":""}" data-act="go" data-v="pessoas"><b>${ppl.length}</b><span>Pessoas a contatar</span></button>
        <button class="stat ok" data-act="doneMonth"><b>${all("task").filter(x=>x.status==="feita"&&(x.completedAt||x.updated||"").slice(0,7)===t.slice(0,7)).length}</b><span>Concluídas em ${["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][d.getMonth()]}</span></button>

      ${panel(prio.length?"Outras para hoje":"Para hoje",today.length,list(today,taskRow,"Nenhuma outra tarefa com prazo hoje."),`<button class="btn ghost" data-act="new" data-kind="task">${ic("plus")}</button>`)}

    </div>
    ${risk.length?panel("Projetos em risco",risk.length,risk.map(p=>{const s=projectStats(p);return `<div class="row click" data-act="open" data-id="${p.id}"><span class="av hot">${ic("folder")}</span><div class="t">${esc(p.title)}<small>${s.late} atrasada(s) · ${s.pct}% concluído${p.due?" · prazo "+fmt(p.due):""}</small></div></div>`}).join("")):""}

function vTarefas(){
  const t=TODAY(),open=openTasks();
  const tab=S.taskTab;
  let body;
  if(tab==="feitas"){const done=all("task").filter(x=>x.status==="feita").sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")).slice(0,60);body=panel("Concluídas",done.length,list(done,taskRow,"Nada concluído ainda."))}
  else{
    const g=[
      ["Atrasadas",open.filter(isLate)],
      ["Hoje",open.filter(x=>x.due===t)],
      ["Próximos 7 dias",open.filter(x=>x.due>t&&x.due<=addDays(t,7)).sort((a,b)=>a.due.localeCompare(b.due))],
      ["Depois",open.filter(x=>x.due>addDays(t,7)).sort((a,b)=>a.due.localeCompare(b.due))],
      ["Sem data",open.filter(x=>!x.due&&x.status!=="aguardando")],
      ["Aguardando outros",open.filter(x=>x.status==="aguardando"&&!x.due)],
    ].filter(([,a])=>a.length);
    body=g.length?g.map(([h,a])=>panel(h,a.length,a.map(taskRow).join(""))).join(""):`<section class="panel"><div class="empty">Nenhuma tarefa aberta. Crie uma ou use a captura.</div></section>`;
  }
  return `<div class="head"><div><h1>Tarefas</h1><p class="sub">${open.length} abertas. A estrela leva a tarefa para as 3 prioridades do dia.</p></div><button class="btn primary" data-act="new" data-kind="task">${ic("plus")}Nova tarefa</button></div>
  <div class="tabs" style="margin-bottom:18px"><button class="tab" aria-pressed="${tab==="abertas"}" data-act="taskTab" data-v="abertas">Abertas</button><button class="tab" aria-pressed="${tab==="feitas"}" data-act="taskTab" data-v="feitas">Concluídas</button></div>
  <div class="stack" style="gap:16px">${body}</div>`;
}

function vAgenda(){
  const t=TODAY(),days=[];
  const evs=all("event"),tasks=openTasks().filter(x=>x.due);
  const pastEv=evs.filter(e=>!e.repeat&&e.date<t);
  for(let i=0;i<21;i++){
    const d=addDays(t,i),es=evs.filter(e=>occursOn(e,d)).sort((a,b)=>(a.time||"").localeCompare(b.time||"")),ts=tasks.filter(x=>x.due===d);

    const dd=new Date(d+"T12:00:00");
    days.push(`<div class="day ${i===0?"today":""} ${es.some(isAgendaBlock)?"wk trip":dd.getDay()===6?"wk sat":dd.getDay()===0?"wk sun":""}"><div class="d">${i===0?"hoje":WD[dd.getDay()]}<b>${dd.getDate()}</b>${MO[dd.getMonth()]}</div><div>${es.map(eventRow).join("")}${ts.map(taskRow).join("")}${!es.length&&!ts.length?`<div class="empty">Livre</div>`:""}</div></div>`);
  }
  const later=evs.filter(e=>!e.repeat&&e.date>addDays(t,20)).sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="head"><div><h1>Agenda</h1><p class="sub">Próximas 3 semanas, com compromissos e tarefas com prazo.${evs.some(e=>e.repeat&&(!e.until||e.until>=t))?` Compromissos com ↻ se repetem sozinhos.`:""}</p></div><button class="btn primary" data-act="new" data-kind="event">${ic("plus")}Novo compromisso</button></div>
  <section class="panel" style="padding-block:8px">${days.join("")}</section>
  ${later.length?`<div style="margin-top:20px">${panel("Mais adiante",later.length,later.map(e=>`<div class="row click" data-act="open" data-id="${e.id}"><span class="chip">${esc(fmt(e.date))}</span><div class="t">${esc(e.title)}</div></div>`).join(""))}</div>`:""}
  ${pastEv.length?`<p class="sub" style="margin-top:14px">${pastEv.length} compromisso(s) passado(s) guardado(s).</p>`:""}`;
}

async function runCapture(text){
  if(!text.trim())return;
  S.capText=text;
  if(!sample){toast("IA indisponível aqui. Salvei como tarefa.");return asTask(text)}
  S.proposals="loading";render();
  const people=anyKind("person").map(p=>p.title).join(", ")||"(nenhuma)";
  const projects=anyKind("project").map(p=>p.title).join(", ")||"(nenhum)";
  const prompt=`Você organiza capturas rápidas de um pastor e videomaker brasileiro (Duca) num sistema pessoal.
Hoje é ${TODAY()} (${WD[new Date().getDay()]}). Áreas possíveis: ${AREAS.join(", ")}.
Pessoas já cadastradas: ${people}.
Projetos já cadastrados: ${projects}.

Transforme o texto abaixo numa lista de itens. Tipos:
- "task": algo que ele precisa fazer (ligar, conversar, preparar, enviar).
- "event": compromisso com data (reunião, culto, visita, gravação).
- "note": ideia, anotação, estudo ou sermão (use noteType "ideia", "nota" ou "sermao").
- "project": só se o texto pedir claramente um projeto novo.
- "person": só se for para cadastrar alguém novo explicitamente.
Datas relativas ("sexta", "semana que vem" = próxima segunda) viram YYYY-MM-DD. Hora em HH:MM.
Compromisso que se repete toda semana ("toda quinta", "semanal") leva "repeat":"7"; a cada duas semanas, "repeat":"14"; a data é a próxima ocorrência.
Use os nomes de pessoas e projetos já cadastrados quando o texto se referir a eles.

Responda só com um array JSON, sem outro texto. Formato de cada item:
{"kind":"task","title":"Conversar com Carlos sobre o orçamento","area":"Ministério","date":"2026-10-09","time":"","person":"Carlos","project":"Conferência","noteType":"","body":"","repeat":""}

TEXTO:
${text}`;
  try{
    const out=await sample.json(prompt,{modelTier:"quick"});
    S.proposals=(Array.isArray(out)?out:[]).filter(x=>x&&x.title).map(x=>({kind:KIND_LABEL[x.kind]?x.kind:"task",title:String(x.title),area:AREAS.includes(x.area)?x.area:"",date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:"",time:/^\d{2}:\d{2}$/.test(x.time)?x.time:"",person:x.person?String(x.person):"",project:x.project?String(x.project):"",noteType:["ideia","nota","sermao"].includes(x.noteType)?x.noteType:"nota",repeat:["7","14"].includes(String(x.repeat))?String(x.repeat):"",body:x.body?String(x.body):"",keep:true}));
  }catch(e){S.proposals=null;toast(e.code==="not_granted"?"IA não autorizada. Use “Salvar como tarefa”.":e.code==="rate_limited"?"Muitas chamadas. Tente em instantes.":"A IA não respondeu. Tente de novo.")}
  render();
}
async function ensure(kind,name){if(!name)return "";const f=findByName(kind,name);if(f)return f.id;const n=make(kind,{title:name,status:kind==="project"?"ativo":undefined});await save(n);return n.id}
async function commit(){
  const P=S.proposals.filter(p=>p.keep!==false);
  for(const p of P){
    const it=make(p.kind,{title:p.title,area:p.area,body:p.body});
    if(p.kind!=="person")it.personId=await ensure("person",p.person);
    if(p.kind!=="project")it.projectId=await ensure("project",p.project);
    if(p.kind==="task"){it.due=p.date;it.time=p.time;it.status=""}
    if(p.kind==="event"){it.date=p.date||TODAY();it.time=p.time;it.repeat=p.repeat||""}
    if(p.kind==="project"){it.due=p.date;it.status="ativo"}
    if(p.kind==="note"){it.noteType=p.noteType;if(p.noteType==="sermao")it.stage="Ideia"}
    await save(it);
  }
  S.proposals=null;S.capText="";toast(`${P.length} item(ns) salvo(s)`);render();
}
async function asTask(text){
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  for(const l of lines)await save(make("task",{title:l,status:""}));
  S.capText="";S.proposals=null;toast(`${lines.length} tarefa(s) salva(s)`);render();
}
async function ask(q){
  if(!q.trim()||S.chatBusy)return;
  if(!sample){toast("Assistente indisponível.");return}
  S.chat.push({role:"user",content:q});S.chatBusy=true;S.liveText="";render();
  const rules=`Você é o chefe de gabinete pessoal do Duca, pastor e estrategista do EKKO (Marília-SP) e videomaker. Responda em português do Brasil, direto e curto, com no máximo 8 linhas ou uma lista curta. Use só os dados abaixo; se faltar algo, diga o que falta. Sugira no máximo 3 próximos passos concretos. Sem markdown pesado: use hífens para listas.\n\nDADOS DO SISTEMA:\n${snapshot()}`;
  chatCtl=new AbortController();
  const turns=[{role:"user",content:rules},...S.chat.slice(-12)];
  try{
    const {text}=await sample(turns,{cache:false,signal:chatCtl.signal,onText:({text})=>{S.liveText=text;const el=document.getElementById("live");if(el)el.textContent=text}});
    S.chat.push({role:"assistant",content:text});
  }catch(e){
    if(e.text)S.chat.push({role:"assistant",content:e.text+(e.code==="cancelled"?"":" (interrompido)")});
    else if(e.code!=="cancelled")S.chat.push({role:"assistant",content:e.code==="not_granted"?"Preciso da sua autorização para usar o Claude nesta página.":e.code==="rate_limited"?"Muitas perguntas seguidas. Tente em instantes.":"Não consegui responder agora. Tente de novo."});
  }
  S.chatBusy=false;render();
  const c=document.getElementById("chat");c?.lastElementChild?.scrollIntoView({block:"nearest"});
}
async function decisions(id){

    const out=await sample.json(`Hoje é ${TODAY()}. Das notas da reunião "${ev.title}" abaixo, extraia as decisões que viram tarefas. Responda só com um array JSON de {"title":"...","person":"nome do responsável ou vazio","date":"YYYY-MM-DD ou vazio"}.\n\nNOTAS:\n${ev.body}`,{modelTier:"quick"});

// ---------- discipulado ----------
const isDisciple=p=>p.disciple==="sim";
const encountersOf=pid=>anyKind("dmeet").filter(m=>m.personId===pid).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
function discStatus(p){
  const last=encountersOf(p.id)[0];
  const lastDate=last?.date||null;
  const every=Number(p.discEvery||14);
  const due=last?.nextDate||(lastDate?addDays(lastDate,every):(p.created?.slice(0,10)||TODAY()));
  const since=lastDate?diff(TODAY(),lastDate):null;
  return {last,lastDate,since,due,late:due<=TODAY()};
}
function disciplesNeeding(){return all("person").filter(isDisciple).map(p=>({p,s:discStatus(p)})).filter(x=>x.s.late).sort((a,b)=>a.s.due.localeCompare(b.s.due))}
function discRow({p,s}){
  return `<div class="row"><span class="av ${s.late?"hot":""}">${esc(initials(p.title))}</span>
    <div class="t click" data-act="open" data-id="${p.id}">${esc(p.title)}<small>${s.lastDate?`último encontro ${esc(fmt(s.lastDate))} (${s.since} dia${s.since===1?"":"s"})`:"sem encontro registrado"}${s.last?.next?" · próximo passo: "+esc(s.last.next):""}</small></div>

  </div>`;
}

async function dmAdd(pid){

  const p=get(pid);if(p&&(!p.lastContact||date>p.lastContact))await save({...p,...formValues(),lastContact:date,contacts:[...(p.contacts||[]),date].slice(-60)});

// ---------- revisão semanal ----------
const weekStart=d=>{const x=new Date(d+"T12:00:00");const wd=(x.getDay()+6)%7;return addDays(d,-wd)};
function weekStats(ws){
  const we=addDays(ws,6),inW=d=>d&&d>=ws&&d<=we;
  const tasks=anyKind("task");
  const done=tasks.filter(t=>t.status==="feita"&&inW((t.completedAt||t.updated||"").slice(0,10)));
  const created=tasks.filter(t=>inW((t.created||"").slice(0,10)));
  const dueMissed=tasks.filter(t=>t.status!=="feita"&&t.due&&inW(t.due)&&t.due<TODAY());
  const evs=occurrences(anyKind("event"),ws,we);
  const contacts=anyKind("person").reduce((n,p)=>n+(p.contacts||[]).filter(inW).length,0);
  const meets=anyKind("dmeet").filter(m=>inW(m.date));
  const sermons=anyKind("note").filter(n=>n.noteType==="sermao"&&inW((n.updated||"").slice(0,10)));
  const perDay=Array.from({length:7},(_,i)=>{const d=addDays(ws,i);return {d,n:done.filter(t=>(t.completedAt||t.updated||"").slice(0,10)===d).length}});
  const base=done.length+dueMissed.length;
  return {ws,we,done,created,dueMissed,evs,contacts,meets,sermons,perDay,rate:base?Math.round(done.length/base*100):null};
}
function currentReviewWeek(){const t=TODAY(),d=new Date(t+"T12:00:00").getDay();return d===0?weekStart(t):addDays(weekStart(t),-7)}
const reviewId=ws=>"review-"+ws;
function monthChart(){
  const t=TODAY(),y=+t.slice(0,4),m=+t.slice(5,7),days=new Date(y,m,0).getDate(),today=+t.slice(8,10),ym=t.slice(0,7);
  const done=anyKind("task").filter(x=>x.status==="feita"&&(x.completedAt||x.updated||"").slice(0,7)===ym);
  const per=Array.from({length:days},(_,i)=>done.filter(x=>+((x.completedAt||x.updated).slice(8,10))===i+1).length);
  const total=per.reduce((a,b)=>a+b,0),max=Math.max(2,...per),best=per.indexOf(Math.max(...per))+1;
  const W=720,H=210,pl=28,pr=8,pt=18,pb=26,cw=(W-pl-pr)/days,bw=Math.max(4,cw*.62),yv=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[0,Math.ceil(max/2),max];
  const mn=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][m-1];
  const bars=per.map((v,i)=>{const d=i+1,x=pl+i*cw+(cw-bw)/2,fut=d>today,isT=d===today;
    return `<g><title>${d} de ${mn}: ${v} concluída${v===1?"":"s"}</title>${fut?`<rect x="${x}" y="${H-pb-3}" width="${bw}" height="3" rx="1.5" class="mc-fut"/>`:`<rect x="${x}" y="${v?yv(v):H-pb-3}" width="${bw}" height="${v?H-pb-yv(v):3}" rx="${Math.min(4,bw/2)}" class="${isT?"mc-today":v?"mc-bar":"mc-zero"}"/>`}${v&&!fut?`<text x="${x+bw/2}" y="${yv(v)-5}" class="mc-val">${v}</text>`:""}${(d===1||d%5===0||isT)?`<text x="${x+bw/2}" y="${H-8}" class="mc-day ${isT?"on":""}">${isT?"hoje":d}</text>`:""}</g>`}).join("");
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${yv(v)}" y2="${yv(v)}" class="mc-grid"/><text x="${pl-8}" y="${yv(v)+4}" class="mc-ax">${v}</text>`).join("");
  return `<section class="panel mchart"><div class="ph"><h2>${mn[0].toUpperCase()+mn.slice(1)} em tempo real<span class="n">tarefas concluídas por dia</span></h2><span class="live"><i></i>ao vivo</span></div>
    <div class="mc-sum"><div><b>${total}</b><span>concluídas no mês</span></div><div><b>${(total/today).toFixed(1).replace(".",",")}</b><span>média por dia</span></div><div><b>${total?"dia "+best:"–"}</b><span>melhor dia</span></div><div><b>${per[today-1]}</b><span>hoje</span></div></div>
    <div class="mc-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tarefas concluídas por dia em ${mn}: ${total} no total">${grid}${bars}</svg></div></section>`;
}

async function genReview(ws,auto){
  if(!sample||S.revBusy)return;
  const st=weekStats(ws);
  S.revBusy=true;render();
  const next=occurrences(anyKind("event"),addDays(ws,7),addDays(ws,13)).map(({e,d})=>`${d} ${e.time||""} ${e.title}`);
  const prompt=`Você é Nollie, assistente do Duca (pastor do EKKO em Marília-SP e videomaker). Escreva a revisão semanal de produtividade dele, em português do Brasil, direta, honesta e encorajadora, sem exageros.

Tarefas concluídas (${st.done.length}): ${st.done.map(t=>t.title).slice(0,40).join("; ")||"nenhuma"}.
Venceram sem fazer (${st.dueMissed.length}): ${st.dueMissed.map(t=>t.title).join("; ")||"nenhuma"}.
Tarefas criadas: ${st.created.length}. Compromissos: ${st.evs.length}. Contatos registrados: ${st.contacts}.
Encontros de discipulado (${st.meets.length}): ${st.meets.map(m=>nameOf(m.personId)+": "+(m.topic||"")).join("; ")||"nenhum"}.
Discípulos com encontro atrasado: ${disciplesNeeding().map(x=>x.p.title).join(", ")||"nenhum"}.
Sermões trabalhados: ${st.sermons.map(n=>n.title+" ("+(n.stage||"")+")").join("; ")||"nenhum"}.
Concluídas por dia (seg→dom): ${st.perDay.map(x=>x.n).join(", ")}.
Agenda da próxima semana: ${next.join("; ")||"vazia"}.
Tarefas abertas: ${anyKind("task").filter(t=>t.status!=="feita").map(t=>t.title+(t.due?" ("+t.due+")":"")).slice(0,40).join("; ")||"nenhuma"}.

Responda só com JSON: {"resumo":"2 a 3 frases","vitorias":["até 3 itens"],"atencao":["até 3 itens"],"prioridades":["exatamente 3 ações concretas para a próxima semana"]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"default",cache:false});
    const ai={resumo:String(out?.resumo||""),vitorias:(out?.vitorias||[]).map(String).slice(0,3),atencao:(out?.atencao||[]).map(String).slice(0,3),prioridades:(out?.prioridades||[]).map(String).slice(0,3)};
    await save({...(get(reviewId(ws))||{}),id:reviewId(ws),kind:"review",week:ws,ai,generatedAt:new Date().toISOString()});
    if(!auto)toast("Revisão pronta");
  }catch(e){if(!auto)toast(e.code==="not_granted"?"Preciso da sua autorização para usar o Claude.":"Não consegui gerar agora. Tente de novo.")}
  S.revBusy=false;render();
}
function maybeAutoReview(){

const SLASH=[
  ["Título","# ","H1"],["Subtítulo","## ","H2"],["Seção","### ","H3"],
  ["Lista","- ","•"],["Lista numerada","1. ","1."],["Checklist","- [ ] ","☐"],
  ["Citação","> ","❝"],["Destaque","! ","!"],["Versículo","!📖 ","📖"],["Fogo (leitura do pregador)","!🔥 ","🔥"],["Novo ponto do sermão","§ponto","+"],["Divisor","---","—"],
];
function inlineMd(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>").replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/~~(.+?)~~/g,"<s>$1</s>");
}
function renderMd(src){
  const L=(src||"").split("\n"),out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  const open=t=>{if(list!==t){close();out.push(`<${t}>`);list=t}};
  L.forEach((raw,i)=>{
    const ind=(raw.match(/^\s*/)[0].length>>1),line=raw.trim(),pad=ind?` style="margin-left:${ind*22}px"`:"";
    let m;
    if(!line){close();out.push('<div class="md-gap"></div>');return}
    if(line==="---"){close();out.push("<hr>");return}
    if(m=line.match(/^(#{1,3}) (.*)/)){close();out.push(`<h${m[1].length+1} class="md-h">${inlineMd(m[2])}</h${m[1].length+1}>`);return}
    if(m=line.match(/^- \[( |x|X)\] (.*)/)){close();const on=m[1]!==" ";out.push(`<label class="md-todo ${on?"on":""}"${pad}><input type="checkbox" ${on?"checked":""} data-line="${i}">${inlineMd(m[2])}</label>`);return}
    if(m=line.match(/^[-*] (.*)/)){open("ul");out.push(`<li${pad}>${inlineMd(m[1])}</li>`);return}
    if(m=line.match(/^\d+[.)] (.*)/)){open("ol");out.push(`<li${pad}>${inlineMd(m[1])}</li>`);return}
    if(m=line.match(/^> (.*)/)){close();out.push(`<blockquote>${inlineMd(m[1])}</blockquote>`);return}
    if(m=line.match(/^!(\p{Extended_Pictographic}\uFE0F?)? ?(.*)/u)){close();const em=m[1]||"💡",cls=em==="📖"?"verse":em==="🔥"?"fire":"";const last=out[out.length-1];

let slashState=null;
function slashCheck(t){
  const pos=t.selectionStart,before=t.value.slice(0,pos),ls=before.lastIndexOf("\n")+1,cur=before.slice(ls);
  const m=cur.match(/^(\s*)\/([\p{L}\s]*)$/u);
  const box=document.getElementById("slash");if(!box)return;
  if(!m){box.hidden=true;slashState=null;return}
  const q=m[2].toLowerCase().normalize("NFD").replace(/\p{M}/gu,"");
  const opts=SLASH.filter(o=>o[0].toLowerCase().normalize("NFD").replace(/\p{M}/gu,"").includes(q));
  if(!opts.length){box.hidden=true;slashState=null;return}
  slashState={start:ls,ind:m[1],end:pos,opts,sel:Math.min(slashState?.sel||0,opts.length-1)};
  box.innerHTML=opts.map((o,i)=>`<button type="button" class="${i===slashState.sel?"on":""}" data-act="slashPick" data-i="${i}"><span>${o[2]}</span>${o[0]}</button>`).join("");
  box.hidden=false;
}
function slashPick(i){
  const t=document.getElementById("f_body");if(!t||!slashState)return;
  const o=slashState.opts[i];
  if(o[1]==="§ponto"){t.value=t.value.slice(0,slashState.start)+t.value.slice(slashState.end);document.getElementById("slash").hidden=true;slashState=null;addSermonPoint();return}
  const ins=slashState.ind+(o[1]==="---"?"---\n":o[1]);
  t.value=t.value.slice(0,slashState.start)+ins+t.value.slice(slashState.end);
  const p=slashState.start+ins.length;t.focus();t.setSelectionRange(p,p);
  document.getElementById("slash").hidden=true;slashState=null;
}
function nedKey(e){
  const t=e.target;
  if(slashState&&!document.getElementById("slash").hidden){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();slashState.sel=(slashState.sel+(e.key==="ArrowDown"?1:-1)+slashState.opts.length)%slashState.opts.length;slashCheck(t);return true}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();slashPick(slashState.sel);return true}
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();document.getElementById("slash").hidden=true;slashState=null;return true}
  }
  const pos=t.selectionStart,v=t.value,ls=v.lastIndexOf("\n",pos-1)+1,line=v.slice(ls,pos);
  if(e.key==="Tab"){e.preventDefault();if(e.shiftKey){if(v.slice(ls,ls+2)==="  "){t.value=v.slice(0,ls)+v.slice(ls+2);t.setSelectionRange(pos-2,pos-2)}}else{t.value=v.slice(0,ls)+"  "+v.slice(ls);t.setSelectionRange(pos+2,pos+2)}return true}
  if(e.key==="Enter"&&!e.shiftKey){
    const m=line.match(/^(\s*)(- \[[ xX]\] |[-*] |(\d+)[.)] |> )(.*)$/);
    if(m){e.preventDefault();
      if(!m[4].trim()){t.value=v.slice(0,ls)+v.slice(pos);t.setSelectionRange(ls,ls);return true}
      let pre=m[2];if(m[3])pre=(Number(m[3])+1)+". ";if(pre.startsWith("- ["))pre="- [ ] ";
      const ins="\n"+m[1]+pre;t.value=v.slice(0,pos)+ins+v.slice(pos);t.setSelectionRange(pos+ins.length,pos+ins.length);return true}
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==="b"||e.key==="i")){e.preventDefault();const a=t.selectionStart,b=t.selectionEnd,w=e.key==="b"?"**":"*";t.value=v.slice(0,a)+w+v.slice(a,b)+w+v.slice(b);t.setSelectionRange(a+w.length,b+w.length);return true}
  return false;
}

async function psdToPng(buf){
  if(!psdLib){await loadScript("https://cdn.jsdelivr.net/npm/ag-psd@31.0.2/dist/bundle.js");psdLib=window.agPsd}
  const psd=psdLib.readPsd(buf,{skipLayerImageData:true,skipThumbnail:true});
  if(!psd.canvas)throw {code:"psd_nocomp"};
  let c=psd.canvas;const max=3000,sc=Math.min(1,max/Math.max(c.width,c.height));

function hashCommand(){
  const h=(location.hash||"").slice(1);
  if(!h.startsWith("n_"))return null;
  try{
    let b=h.slice(2).replace(/-/g,"+").replace(/_/g,"/").replace(/[^A-Za-z0-9+/]/g,"");
    while(b.length%4)b+="=";
    const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
    const text=new TextDecoder().decode(bytes).trim();
    return text?{key:h,text}:null;
  }catch(e){return null}
}

Regras dos itens:
- kind: "task" (algo a fazer), "event" (tem dia/hora: reunião, culto, visita, gravação), "note" (ideia, estudo, sermão; noteType "ideia","nota" ou "sermao"), "project", "person".
- Datas relativas viram YYYY-MM-DD ("sexta" = próxima sexta; "amanhã"). Hora HH:MM.
- Compromisso semanal ("toda quinta") leva "repeat":"7"; quinzenal "repeat":"14"; date = próxima ocorrência.
- Use nomes já cadastrados quando o texto se referir a eles.

Responda só com JSON neste formato:
{"reply":"Anotado: reunião com Carlos na quinta às 19h.","items":[{"kind":"event","title":"Reunião com Carlos","area":"Ministério","date":"2026-10-08","time":"19:00","repeat":"","person":"Carlos","project":"","noteType":"","body":""}]}

DADOS:
${snapshot().slice(0,60000)}

MENSAGEM DO DUCA:
${text}`;
  N.ctl=new AbortController();
  try{
    const out=await sample.json(prompt,{modelTier:"quick",signal:N.ctl.signal,cache:false});
    const items=(Array.isArray(out?.items)?out.items:[]).filter(x=>x&&x.title).map(x=>({kind:KIND_LABEL[x.kind]?x.kind:"task",title:String(x.title),area:AREAS.includes(x.area)?x.area:"",date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:"",time:/^\d{2}:\d{2}$/.test(x.time)?x.time:"",repeat:["7","14"].includes(String(x.repeat))?String(x.repeat):"",person:x.person?String(x.person):"",project:x.project?String(x.project):"",noteType:["ideia","nota","sermao"].includes(x.noteType)?x.noteType:"nota",body:x.body?String(x.body):""}));
    const track=[];
    for(const p of items){const it=await createItem(p);track.push(it.id)}
    N.created=track;
    N.say=String(out?.reply||(items.length?`Anotado: ${items.length} item(ns).`:"Pronto."));
    N.long=!items.length&&N.say.length>90;
    speak(N.say);
  }catch(e){
    if(e.code==="cancelled")return;
    N.draft=text;
    N.say=e.code==="not_granted"?"Preciso da sua autorização para usar o Claude. Tente de novo e permita.":e.code==="rate_limited"?"Muitas mensagens seguidas. Me dê alguns segundos.":"Não consegui processar agora. Sua mensagem continua no campo; tente de novo.";
  }
  N.busy=false;renderNollie();
}
async function nollieUndo(id){
  const it=get(id);if(!it)return;
  await remove(id);N.created=N.created.filter(x=>x!==id);
  N.say=N.created.length?"Desfeito.":"Desfeito. Nada ficou salvo dessa anotação.";renderNollie();
}

// ---------- render ----------
function navHtml(mobile){
  const counts={tarefas:openTasks().filter(isLate).length,pessoas:peopleToContact().length};
  if(mobile){
    const b=x=>`<button data-act="go" data-v="${x}" ${S.view===x?'aria-current="page"':""} aria-label="${VIEWS.find(v=>v.id===x).label}">${ic(VIEWS.find(v=>v.id===x).ic)}</button>`;
    return b("hoje")+b("agenda")+`<button class="cap" data-act="nopen" aria-label="Nollie">${ic("spark")}</button>`+b("pessoas")+`<button data-act="more" aria-label="Mais" ${S.more?'aria-current="page"':""}>${ic("more")}</button>`;
  }
  return VIEWS.map(x=>`<button class="nav-btn" data-act="go" data-v="${x.id}" ${S.view===x.id?'aria-current="page"':""}>${ic(x.ic)}<span class="lbl">${x.label}</span>${counts[x.id]?`<span class="count">${counts[x.id]}</span>`:""}</button>`).join("");
}
function render(){
  const a=document.activeElement,aid=a?.id,pos=a&&"selectionStart" in a?a.selectionStart:null,val=a?.value;
  document.getElementById("sidenav").innerHTML=navHtml(false);
  document.getElementById("bottomnav").innerHTML=navHtml(true);
  const V={hoje:vHoje,inbox:vInbox,tarefas:vTarefas,agenda:vAgenda,projetos:vProjetos,pessoas:vPessoas,notas:vNotas,ia:vIA,revisao:vRevisao}[S.view];
  const lensSel=`<div class="mlens"><select id="lensM" aria-label="Área">${["Tudo",...AREAS].map(x=>`<option ${S.area===x?"selected":""}>${x}</option>`).join("")}</select></div>`;
  const more=S.more?`<div class="more">${VIEWS.filter(x=>!["hoje","agenda","pessoas"].includes(x.id)).map(x=>`<button data-act="go" data-v="${x.id}">${ic(x.ic)}${x.label}</button>`).join("")}</div>`:"";
  document.getElementById("main").innerHTML=S.ready?lensSel+V()+more:`<p class="sub">Carregando…</p>`;
  document.getElementById("lens").value=S.area;
  if(aid&&aid!=="f_title"){const el=document.getElementById(aid);if(el&&el.tagName!=="SELECT"&&!S.editing){if(val!==undefined&&el.value!==val&&(aid==="quick"||aid==="chatIn"||aid==="capText"))el.value=val;el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  if(S.editing&&S.items.has(S.editing.id)&&!document.getElementById("overlay").contains(document.activeElement)){S.editing={...S.items.get(S.editing.id),...formValues()};renderOverlay()}
}
function formValues(){const f=document.querySelector('[data-form="edit"]');if(!f)return {};return Object.fromEntries(new FormData(f))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

// ---------- eventos ----------
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if((act==="close"||act==="nclose")&&e.target!==el)return;
  e.stopPropagation();
  switch(act){
    case"nedMode":if(e.target.closest(".md-todo"))return;S.editing={...S.editing,...formValues()};S.noteMode=el.dataset.v;renderOverlay();if(S.noteMode==="escrever"){const t=document.getElementById("f_body");t?.focus()}break;
    case"dmAdd":dmAdd(id);break;
    case"dmDel":{const m=get(id);if(S.dmConfirm!==id){S.dmConfirm=id;el.innerHTML="Apagar?";el.classList.add("on");break}S.dmConfirm=null;await remove(id);S.editing={...get(m.personId),...formValues()};renderOverlay();break}
    case"revWeek":S.reviewWeek=el.dataset.v;render();break;
    case"revGen":genReview(el.dataset.v);break;
    case"revTask":{const ai=get(reviewId(el.dataset.v))?.ai;const title=ai?.prioridades?.[+el.dataset.i];if(title){await save(make("task",{title,status:"",due:addDays(el.dataset.v,8)}));toast("Tarefa criada para segunda");el.disabled=true}break}
    case"slashPick":slashPick(Number(el.dataset.i));break;
    case"addPoint":if(S.noteMode!=="escrever"){S.editing={...S.editing,...formValues()};S.noteMode="escrever";renderOverlay()}addSermonPoint();break;
    case"tplApply":{const b=document.getElementById("f_body");if(b.value.trim()&&S.tplConfirm!==S.editing.id){S.tplConfirm=S.editing.id;el.textContent="Substituir texto?";el.classList.add("danger");break}S.tplConfirm=null;b.value=SERMON_TEMPLATE;S.editing={...S.editing,...formValues()};S.noteMode="escrever";renderOverlay();toast("Modelo aplicado");break}
    case"avatar":document.getElementById("avatarIn").click();break;
    case"pdf":document.getElementById("pdfIn").click();break;
    case"attach":S.attachTo=id;document.getElementById("fileIn").click();break;
    case"unattach":unattach(id,Number(el.dataset.i));break;
    case"doneMonth":S.view="tarefas";S.taskTab="feitas";S.more=false;render();window.scrollTo(0,0);break;
    case"go":S.view=el.dataset.v;S.more=false;render();window.scrollTo(0,0);break;
    case"nopen":S.more=false;render();openNollie();break;
    case"nclose":if(e.target===el)closeNollie();break;
    case"nx":closeNollie();break;
    case"nvoice":N.voice=!N.voice;try{localStorage.setItem("nollieVoice",N.voice?"on":"off")}catch(_){}if(!N.voice){try{speechSynthesis.cancel()}catch(_){}N.speaking=false}else{N.unlocked=false;unlockSpeech()}renderNollie();toast(N.voice?"Voz da Nollie ligada":"Voz da Nollie desligada");break;
    case"nsayagain":if(N.speaking){try{speechSynthesis.cancel()}catch(_){}N.speaking=false;renderNollieSoft()}else{const v=N.voice;N.voice=true;speak(N.say);N.voice=v}break;
    case"nmic":N.hands=!N.hands;if(N.hands&&!N.voice){N.voice=true;try{localStorage.setItem("nollieVoice","on")}catch(_){}}unlockSpeech();renderNollie();if(N.hands){const t=document.getElementById("nIn");t?.focus()}break;
    case"nask":unlockSpeech();nollieSend(el.dataset.q);break;
    case"nundo":nollieUndo(id);break;
    case"nedit":closeNollie();openDetail({...get(id)});break;
    case"nclear":N.say="";N.created=[];N.long=false;renderNollie();break;
    case"more":S.more=!S.more;render();window.scrollTo(0,0);break;
    case"toggle":{const t={...get(id)};t.status=t.status==="feita"?"":"feita";if(t.status==="feita"){t.prio=false;t.completedAt=new Date().toISOString()}else delete t.completedAt;
      if(t.status==="feita"&&t.repeat){const n=make("task",{...t,id:undefined,status:"",due:t.due?addDays(t.due,Number(t.repeat)):""});n.id=uid();delete n.created;await save(n)}
      await save(t);break}
    case"prio":{const t={...get(id)};if(!t.prio&&openTasks().filter(x=>x.prio).length>=3){toast("Máximo de 3 prioridades. Desmarque uma antes.");break}t.prio=!t.prio;await save(t);break}
    case"open":openDetail({...get(id)});break;
    case"new":openDetail(make(el.dataset.kind,{status:el.dataset.kind==="project"?"ativo":"",noteType:el.dataset.type||"nota",stage:el.dataset.type==="sermao"?"Ideia":undefined,body:el.dataset.type==="sermao"?SERMON_TEMPLATE:undefined,date:el.dataset.kind==="event"?TODAY():undefined}));break;
    case"newLinked":{const p=get(id);const k=el.dataset.kind;openDetail(make(k,{area:p.area||"",[p.kind==="project"?"projectId":"personId"]:id,status:"",noteType:"nota",date:k==="event"?TODAY():undefined}));break}
    case"contact":{const p={...get(id)};p.lastContact=TODAY();p.contacts=[...(p.contacts||[]),TODAY()].slice(-60);if(!p.cadence)p.cadence="30";await save(p);toast(`Contato com ${p.title} registrado`);if(S.editing?.id===id){S.editing={...p};renderOverlay()}break}
    case"closeBtn":case"close":S.editing=null;renderOverlay();break;
    case"del":if(S.confirmDel===id){S.editing=null;renderOverlay();await remove(id);toast("Excluído")}else{S.editing={...S.editing,...formValues()};S.confirmDel=id;renderOverlay()}break;
    case"taskTab":S.taskTab=el.dataset.v;render();break;
    case"noteTab":S.noteTab=el.dataset.v;render();break;
    case"asTask":asTask(document.getElementById("capText").value);break;
    case"discard":S.proposals=null;render();break;
    case"commit":commit();break;
    case"ask":ask(el.dataset.q);break;
    case"stop":chatCtl?.abort();break;
    case"clearChat":S.chat=[];render();break;
    case"decisions":await save({...S.editing,...formValues()});decisions(id);break;
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==="nollie"){unlockSpeech();const t=document.getElementById("nIn");nollieSend(t.value);return}
  if(k==="quick"){const v=document.getElementById("quick").value;if(!v.trim())return;S.view="inbox";render();runCapture(v)}
  if(k==="capture")runCapture(document.getElementById("capText").value);
  if(k==="chat"){const i=document.getElementById("chatIn");const q=i.value;i.value="";ask(q)}
  if(k==="edit"){const it={...S.editing,...formValues()};if(!it.title.trim()){toast("Dê um título.");return}S.editing=null;renderOverlay();await save(it);toast("Salvo")}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.line!==undefined&&t.closest(".md")){const src=document.getElementById("f_body");const L=src.value.split("\n");const n=+t.dataset.line;L[n]=L[n].replace(/- \[( |x|X)\]/,t.checked?"- [x]":"- [ ]");src.value=L.join("\n");S.editing={...S.editing,...formValues()};renderOverlay();return}
  if(t.id==="avatarIn"){setAvatar(t.files?.[0]);return}
  if(t.id==="pdfIn"){importPdf(t.files?.[0]);return}
  if(t.id==="fileIn"){const fl=[...t.files];t.value="";attachFiles(S.attachTo||S.editing?.id,fl);return}
  if(t.id==="lens"||t.id==="lensM"){S.area=t.value;render();return}
  if(t.dataset.pi!==undefined){const p=S.proposals[+t.dataset.pi];p[t.dataset.pf]=t.type==="checkbox"?t.checked:t.value;if(t.dataset.pf==="kind")render();return}
  if(t.name==="noteType"&&t.value==="sermao"){const b=document.getElementById("f_body");if(b&&!b.value.trim())b.value=SERMON_TEMPLATE}
  if(t.name==="noteType"||t.name==="stage"||t.name==="disciple"||(t.name==="repeat"&&S.editing?.kind==="event")){S.editing={...S.editing,...formValues()};renderOverlay()}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="f_body"&&t.classList.contains("ned-src")){slashCheck(t);return}if(t.id==="nIn"){N.draft=t.value;autoGrow(t);clearTimeout(handsTimer);if(N.hands&&t.value.trim()){const v=t.value;handsTimer=setTimeout(()=>{const t2=document.getElementById("nIn");if(N.open&&!N.busy&&t2&&t2.value===v)nollieSend(v)},2200)}return}if(t.dataset.pi!==undefined&&t.type!=="checkbox")S.proposals[+t.dataset.pi][t.dataset.pf]=t.value;if(t.id==="capText")S.capText=t.value});
document.addEventListener("keydown",e=>{
  if(e.target.id==="f_body"&&e.target.classList.contains("ned-src")&&nedKey(e))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();N.open?closeNollie():openNollie();return}
  if(e.key==="Escape"&&N.open){closeNollie();return}
  if(e.key==="Escape"&&S.editing){S.editing=null;renderOverlay();return}
  if(e.target.id==="nIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();clearTimeout(handsTimer);unlockSpeech();nollieSend(e.target.value)}
});

document.getElementById("lens").innerHTML=["Tudo",...AREAS].map(x=>`<option>${x}</option>`).join("");
render();
if(window.claude){initStore();claude.use("sample").then(s=>{sample=s;render();runHashCommand();setTimeout(maybeAutoReview,1500)});claude.use("assets").then(a=>{assetsApi=a;if(S.editing)renderOverlay()})}else localStore();
</script>
